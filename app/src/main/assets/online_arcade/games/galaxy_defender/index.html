<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Galaxy Space Defender</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    body {
      background: #020617;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      touch-action: none;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 480px;
      max-height: 850px;
      overflow: hidden;
      background: #000;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .hud {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      z-index: 10;
    }
    .stat {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(0, 229, 255, 0.3);
      border-radius: 10px;
      padding: 6px 12px;
      font-weight: 800;
      font-size: 13px;
    }
    .stat span { color: #00E5FF; font-size: 16px; }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(2, 6, 23, 0.88);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      padding: 24px;
      text-align: center;
    }
    .title {
      font-size: 30px;
      font-weight: 900;
      background: linear-gradient(135deg, #38BDF8, #A855F7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    .subtitle { font-size: 14px; color: #94A3B8; margin-bottom: 24px; }
    .btn-play {
      background: linear-gradient(135deg, #00E5FF, #3B82F6);
      color: #000;
      font-weight: 900;
      font-size: 17px;
      border: none;
      border-radius: 30px;
      padding: 14px 36px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.4);
    }
    .tip {
      position: absolute;
      bottom: 20px;
      left: 0; right: 0;
      text-align: center;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.4);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div class="hud">
      <div class="stat">SCORE: <span id="hud-score">0</span></div>
      <div class="stat">SHIELD: <span id="hud-shield" style="color: #00E676;">100%</span></div>
      <div class="stat">WAVE: <span id="hud-wave">1</span></div>
    </div>

    <canvas id="cvs"></canvas>
    <div class="tip">Touch and drag ship to steer and auto-fire lasers</div>

    <div class="overlay" id="start-overlay">
      <div class="title">GALAXY DEFENDER</div>
      <div class="subtitle">Defend the nebula against invading alien armadas!</div>
      <button class="btn-play" id="btn-start">DEPLOY FIGHTER ▶</button>
    </div>

    <div class="overlay" id="gameover-overlay" style="display: none;">
      <div class="title" style="background: linear-gradient(135deg, #EF4444, #F43F5E); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">VESSEL DESTROYED</div>
      <div class="subtitle" id="final-stats">Final Score: 0</div>
      <button class="btn-play" id="btn-restart">RETRY MISSION ↺</button>
    </div>
  </div>

  <script>
    const cvs = document.getElementById("cvs");
    const ctx = cvs.getContext("2d");
    const container = document.getElementById("game-container");

    let W, H;
    function resize() {
      W = cvs.width = container.clientWidth;
      H = cvs.height = container.clientHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    // Audio synthesizer
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let actx;
    function initSound() {
      if (!actx) actx = new AudioContext();
    }
    function beep(freq, type="square", duration=0.08) {
      if (!actx) return;
      try {
        const osc = actx.createOscillator();
        const g = actx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, actx.currentTime);
        g.gain.setValueAtTime(0.12, actx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01, actx.currentTime + duration);
        osc.connect(g);
        g.connect(actx.destination);
        osc.start();
        osc.stop(actx.currentTime + duration);
      } catch(e) {}
    }

    let isRunning = false;
    let score = 0;
    let shield = 100;
    let wave = 1;

    // Stars background
    const stars = Array.from({length: 60}, () => ({
      x: Math.random() * 480,
      y: Math.random() * 850,
      speed: 0.5 + Math.random() * 2.5,
      size: Math.random() * 2
    }));

    // Player ship
    const player = {
      x: W / 2,
      y: H - 120,
      w: 38,
      h: 38,
      vx: 0,
      vy: 0
    };

    let bullets = [];
    let enemies = [];
    let particles = [];
    let fireTimer = 0;

    // Touch control
    let isDragging = false;
    container.addEventListener("pointerdown", e => {
      isDragging = true;
      const rect = cvs.getBoundingClientRect();
      player.x = e.clientX - rect.left;
      player.y = e.clientY - rect.top;
    });
    window.addEventListener("pointermove", e => {
      if (!isDragging || !isRunning) return;
      const rect = cvs.getBoundingClientRect();
      player.x = Math.max(20, Math.min(W - 20, e.clientX - rect.left));
      player.y = Math.max(40, Math.min(H - 40, e.clientY - rect.top));
    });
    window.addEventListener("pointerup", () => isDragging = false);

    function spawnEnemy() {
      const type = Math.random() < 0.25 ? "heavy" : "scout";
      enemies.push({
        x: 30 + Math.random() * (W - 60),
        y: -30,
        w: type === "heavy" ? 44 : 28,
        h: type === "heavy" ? 44 : 28,
        hp: type === "heavy" ? 3 : 1,
        maxHp: type === "heavy" ? 3 : 1,
        speed: type === "heavy" ? 1.5 : 2.5 + wave * 0.2,
        color: type === "heavy" ? "#EC4899" : "#F59E0B"
      });
    }

    function createExplosion(x, y, color) {
      for (let i = 0; i < 14; i++) {
        const angle = Math.random() * Math.PI * 2;
        const spd = 1 + Math.random() * 4;
        particles.push({
          x, y,
          vx: Math.cos(angle) * spd,
          vy: Math.sin(angle) * spd,
          life: 25,
          color: color
        });
      }
    }

    let enemyTimer = 0;

    function reset() {
      score = 0;
      shield = 100;
      wave = 1;
      player.x = W / 2;
      player.y = H - 120;
      bullets = [];
      enemies = [];
      particles = [];
      document.getElementById("hud-score").textContent = "0";
      document.getElementById("hud-shield").textContent = "100%";
      document.getElementById("hud-wave").textContent = "1";
    }

    function update() {
      if (!isRunning) return;

      // Stars
      stars.forEach(s => {
        s.y += s.speed;
        if (s.y > H) {
          s.y = 0;
          s.x = Math.random() * W;
        }
      });

      // Fire bullets
      fireTimer++;
      if (fireTimer > 10) {
        bullets.push({ x: player.x - 10, y: player.y - 15, vy: -12 });
        bullets.push({ x: player.x + 10, y: player.y - 15, vy: -12 });
        beep(880, "triangle", 0.04);
        fireTimer = 0;
      }

      // Update bullets
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.y += b.vy;
        if (b.y < -20) bullets.splice(i, 1);
      }

      // Spawn enemies
      enemyTimer++;
      if (enemyTimer > Math.max(25, 60 - wave * 4)) {
        spawnEnemy();
        enemyTimer = 0;
      }

      // Update enemies
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        e.y += e.speed;

        // Check bullet hit
        for (let j = bullets.length - 1; j >= 0; j--) {
          const b = bullets[j];
          if (Math.abs(b.x - e.x) < e.w / 2 && Math.abs(b.y - e.y) < e.h / 2) {
            bullets.splice(j, 1);
            e.hp--;
            createExplosion(b.x, b.y, "#00E5FF");
            if (e.hp <= 0) {
              createExplosion(e.x, e.y, e.color);
              beep(220, "sawtooth", 0.15);
              score += e.maxHp * 100;
              document.getElementById("hud-score").textContent = score;
              if (score > wave * 1000) {
                wave++;
                document.getElementById("hud-wave").textContent = wave;
              }
              enemies.splice(i, 1);
              break;
            }
          }
        }

        // Check crash with player
        if (Math.abs(player.x - e.x) < (player.w + e.w) / 2.5 &&
            Math.abs(player.y - e.y) < (player.h + e.h) / 2.5) {
          createExplosion(e.x, e.y, "#EF4444");
          beep(110, "sawtooth", 0.3);
          shield -= 25;
          document.getElementById("hud-shield").textContent = shield + "%";
          enemies.splice(i, 1);
          if (shield <= 0) {
            endGame();
            return;
          }
        }

        if (e.y > H + 50) enemies.splice(i, 1);
      }

      // Update particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    function draw() {
      ctx.fillStyle = "#020617";
      ctx.fillRect(0, 0, W, H);

      // Stars
      ctx.fillStyle = "#FFF";
      stars.forEach(s => {
        ctx.fillRect(s.x, s.y, s.size, s.size);
      });

      // Bullets
      ctx.fillStyle = "#38BDF8";
      ctx.shadowColor = "#38BDF8";
      ctx.shadowBlur = 8;
      bullets.forEach(b => {
        ctx.fillRect(b.x - 2, b.y - 8, 4, 16);
      });
      ctx.shadowBlur = 0;

      // Enemies
      enemies.forEach(e => {
        ctx.fillStyle = e.color;
        ctx.shadowColor = e.color;
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.moveTo(e.x, e.y + e.h / 2);
        ctx.lineTo(e.x - e.w / 2, e.y - e.h / 2);
        ctx.lineTo(e.x + e.w / 2, e.y - e.h / 2);
        ctx.closePath();
        ctx.fill();
        ctx.shadowBlur = 0;
      });

      // Player Ship
      ctx.fillStyle = "#00E5FF";
      ctx.shadowColor = "#00E5FF";
      ctx.shadowBlur = 14;
      ctx.beginPath();
      ctx.moveTo(player.x, player.y - player.h / 2);
      ctx.lineTo(player.x - player.w / 2, player.y + player.h / 2);
      ctx.lineTo(player.x, player.y + player.h / 3);
      ctx.lineTo(player.x + player.w / 2, player.y + player.h / 2);
      ctx.closePath();
      ctx.fill();
      ctx.shadowBlur = 0;

      // Engine Thruster
      ctx.fillStyle = "#F59E0B";
      ctx.beginPath();
      ctx.arc(player.x, player.y + player.h / 2 + 4, 5 + Math.random() * 4, 0, Math.PI * 2);
      ctx.fill();

      // Particles
      particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
      });
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    function endGame() {
      isRunning = false;
      document.getElementById("final-stats").textContent = "Final Score: " + score + " | Wave: " + wave;
      document.getElementById("gameover-overlay").style.display = "flex";
    }

    document.getElementById("btn-start").onclick = () => {
      initSound();
      document.getElementById("start-overlay").style.display = "none";
      reset();
      isRunning = true;
    };

    document.getElementById("btn-restart").onclick = () => {
      document.getElementById("gameover-overlay").style.display = "none";
      reset();
      isRunning = true;
    };
  </script>
</body>
</html>
