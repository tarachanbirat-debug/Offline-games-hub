<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Neon Retro Snake</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0B0718;
      color: #FFF;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100vh;
      padding: 16px;
      overflow: hidden;
      touch-action: none;
    }
    #header {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 400px;
      padding: 10px 16px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 14px;
      border: 1px solid rgba(0, 255, 163, 0.3);
    }
    .badge { font-weight: 800; font-size: 16px; }
    .score { color: #00FFA3; text-shadow: 0 0 10px #00FFA3; }
    #board-box {
      width: 100%;
      max-width: 360px;
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      width: 100%;
      height: 100%;
      background: #120D26;
      border: 2px solid #00FFA3;
      border-radius: 16px;
      box-shadow: 0 0 20px rgba(0, 255, 163, 0.2);
    }
    /* Touch D-Pad */
    #dpad {
      display: grid;
      grid-template-columns: repeat(3, 64px);
      grid-template-rows: repeat(3, 56px);
      gap: 6px;
      margin-top: 8px;
    }
    .dpad-btn {
      background: #1E1638;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      color: #FFF;
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    }
    .dpad-btn:active {
      background: #00FFA3;
      color: #000;
      transform: scale(0.95);
    }
  </style>
</head>
<body>
  <div id="header">
    <div class="badge score">SCORE: <span id="scoreVal">0</span></div>
    <div style="font-weight: 800; color: #FFD600;">RETRO SNAKE</div>
    <div class="badge" style="color: #A59BC8;">BEST: <span id="bestVal">0</span></div>
  </div>

  <div id="board-box">
    <canvas id="snakeCanvas" width="300" height="300"></canvas>
  </div>

  <div id="dpad">
    <div></div>
    <div class="dpad-btn" onclick="setDir(0, -1)">▲</div>
    <div></div>
    <div class="dpad-btn" onclick="setDir(-1, 0)">◀</div>
    <div class="dpad-btn" onclick="togglePause()" style="font-size: 14px; font-weight: 900; color: #00D2FF;">PAUSE</div>
    <div class="dpad-btn" onclick="setDir(1, 0)">▶</div>
    <div></div>
    <div class="dpad-btn" onclick="setDir(0, 1)">▼</div>
    <div></div>
  </div>

  <script>
    const canvas = document.getElementById('snakeCanvas');
    const ctx = canvas.getContext('2d');
    const scoreVal = document.getElementById('scoreVal');
    const bestVal = document.getElementById('bestVal');

    const gridSize = 15;
    const tileCount = 20;

    let snake = [{x: 10, y: 10}, {x: 10, y: 11}, {x: 10, y: 12}];
    let dirX = 0, dirY = -1;
    let nextDirX = 0, nextDirY = -1;
    let food = {x: 5, y: 5};
    let score = 0;
    let best = 0;
    let isPaused = false;
    let gameOver = false;

    function setDir(dx, dy) {
      if ((dx !== 0 && dirX === -dx) || (dy !== 0 && dirY === -dy)) return;
      nextDirX = dx;
      nextDirY = dy;
      if (gameOver) restart();
    }

    function togglePause() {
      isPaused = !isPaused;
    }

    function restart() {
      snake = [{x: 10, y: 10}, {x: 10, y: 11}, {x: 10, y: 12}];
      dirX = 0; dirY = -1;
      nextDirX = 0; nextDirY = -1;
      score = 0;
      scoreVal.textContent = score;
      gameOver = false;
      spawnFood();
    }

    function spawnFood() {
      food = {
        x: Math.floor(Math.random() * tileCount),
        y: Math.floor(Math.random() * tileCount)
      };
    }

    // Touch swipe gestures
    let startX = 0, startY = 0;
    window.addEventListener('touchstart', e => {
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
    });
    window.addEventListener('touchend', e => {
      const diffX = e.changedTouches[0].clientX - startX;
      const diffY = e.changedTouches[0].clientY - startY;
      if (Math.abs(diffX) > Math.abs(diffY)) {
        if (diffX > 30) setDir(1, 0);
        else if (diffX < -30) setDir(-1, 0);
      } else {
        if (diffY > 30) setDir(0, 1);
        else if (diffY < -30) setDir(0, -1);
      }
    });

    function gameStep() {
      if (isPaused || gameOver) return;

      dirX = nextDirX;
      dirY = nextDirY;

      const head = { x: snake[0].x + dirX, y: snake[0].y + dirY };

      // Wall wrap
      if (head.x < 0) head.x = tileCount - 1;
      if (head.x >= tileCount) head.x = 0;
      if (head.y < 0) head.y = tileCount - 1;
      if (head.y >= tileCount) head.y = 0;

      // Self collision
      for (let i = 0; i < snake.length; i++) {
        if (snake[i].x === head.x && snake[i].y === head.y) {
          gameOver = true;
          return;
        }
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreVal.textContent = score;
        if (score > best) {
          best = score;
          bestVal.textContent = best;
        }
        spawnFood();
      } else {
        snake.pop();
      }
    }

    function draw() {
      ctx.fillStyle = '#120D26';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Food (Glow Apple)
      ctx.fillStyle = '#FF3366';
      ctx.shadowColor = '#FF3366';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc((food.x + 0.5) * gridSize, (food.y + 0.5) * gridSize, gridSize / 2 - 1, 0, Math.PI * 2);
      ctx.fill();

      // Snake Body
      ctx.shadowColor = '#00FFA3';
      ctx.shadowBlur = 8;
      snake.forEach((segment, idx) => {
        ctx.fillStyle = (idx === 0) ? '#00D2FF' : '#00FFA3';
        ctx.beginPath();
        ctx.roundRect(segment.x * gridSize + 1, segment.y * gridSize + 1, gridSize - 2, gridSize - 2, 4);
        ctx.fill();
      });
      ctx.shadowBlur = 0;

      if (gameOver) {
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#FF3366';
        ctx.font = 'bold 24px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 10);
        ctx.fillStyle = '#FFF';
        ctx.font = '14px sans-serif';
        ctx.fillText('Tap D-pad to restart', canvas.width / 2, canvas.height / 2 + 20);
      }
    }

    setInterval(() => {
      gameStep();
      draw();
    }, 110);
  </script>
</body>
</html>
