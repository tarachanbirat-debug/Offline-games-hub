<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Color Switch</title>
<style>
body { background: #0B0F19; margin: 0; overflow: hidden; font-family: sans-serif; color: #fff; text-align: center; }
#ui { display: flex; justify-content: space-around; padding: 12px; font-size: 18px; font-weight: bold; background: #1E293B; }
canvas { display: block; margin: 15px auto; background: #1E293B; box-shadow: 0 0 20px rgba(0,0,0,0.8); }
.controls { margin-top: 10px; }
button { background: #38BDF8; color: #000; border: none; font-size: 20px; padding: 14px 40px; border-radius: 12px; font-weight: bold; cursor: pointer; }
</style>
</head>
<body>
<div id="ui">
  <div>SCORE: <span id="score">0</span></div>
  <div>BEST: <span id="best">0</span></div>
</div>
<canvas id="canvas" width="320" height="380"></canvas>
<div class="controls">
  <button onclick="jumpBall()">JUMP ▲</button>
</div>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let score = 0, ballY = 300;
let best = localStorage.getItem('colorswitch_high') || 0;
document.getElementById('best').innerText = best;

function jumpBall() {
  score += 10;
  ballY -= 40;
  if(ballY < 50) ballY = 300;
  document.getElementById('score').innerText = score;
  if(score > best) { best = score; localStorage.setItem('colorswitch_high', best); document.getElementById('best').innerText = best; }
}

function update() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = '#38BDF8';
  ctx.beginPath(); ctx.arc(160, ballY, 14, 0, Math.PI*2); ctx.fill();
  requestAnimationFrame(update);
}
update();
</script>
</body>
</html>
