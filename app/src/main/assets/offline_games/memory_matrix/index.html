<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Memory Matrix</title>
<style>
body { background: #0B0F19; margin: 0; overflow: hidden; font-family: sans-serif; color: #fff; text-align: center; }
#ui { padding: 15px; font-size: 18px; font-weight: bold; background: #1E293B; }
#grid { display: grid; grid-template-columns: repeat(3, 80px); gap: 10px; justify-content: center; margin: 40px auto; background: #1E293B; padding: 12px; border-radius: 14px; }
.tile { width: 80px; height: 80px; background: #334155; border-radius: 10px; cursor: pointer; }
.lit { background: #10B981; }
</style>
</head>
<body>
<div id="ui">LEVEL: <span id="level">1</span> | BEST: <span id="best">0</span></div>
<div id="grid"></div>
<script>
let level = 1, sequence = [], playerSeq = [], active = false;
let best = localStorage.getItem('memory_high') || 0;
document.getElementById('best').innerText = best;

let grid = document.getElementById('grid');
let tiles = [];
for(let i=0; i<9; i++) {
  let div = document.createElement('div');
  div.className = 'tile';
  div.onclick = () => {
    if(!active) return;
    playerSeq.push(i);
    div.classList.add('lit');
    setTimeout(() => div.classList.remove('lit'), 200);

    let idx = playerSeq.length - 1;
    if(playerSeq[idx] !== sequence[idx]) {
      alert('Game Over! Reached Level: ' + level);
      level = 1; sequence = []; startLevel();
    } else if(playerSeq.length === sequence.length) {
      if(level > best) { best = level; localStorage.setItem('memory_high', best); document.getElementById('best').innerText = best; }
      level++;
      setTimeout(startLevel, 1000);
    }
  };
  grid.appendChild(div);
  tiles.push(div);
}

function startLevel() {
  document.getElementById('level').innerText = level;
  playerSeq = [];
  sequence.push(Math.floor(Math.random()*9));
  active = false;
  
  let i = 0;
  let interval = setInterval(() => {
    if(i < sequence.length) {
      let t = tiles[sequence[i]];
      t.classList.add('lit');
      setTimeout(() => t.classList.remove('lit'), 400);
      i++;
    } else {
      clearInterval(interval);
      active = true;
    }
  }, 700);
}

startLevel();
</script>
</body>
</html>
