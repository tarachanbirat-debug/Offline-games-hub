<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Cyber Pong 2D</title>
<style>
body { background: #0B0F19; margin: 0; overflow: hidden; font-family: sans-serif; color: #fff; text-align: center; }
#ui { display: flex; justify-content: space-around; padding: 12px; font-size: 18px; font-weight: bold; background: #1E293B; }
canvas { display: block; margin: 15px auto; background: #1E293B; box-shadow: 0 0 20px rgba(0,0,0,0.8); }
.controls { display: flex; justify-content: center; gap: 40px; margin-top: 10px; }
button { background: #38BDF8; color: #000; border: none; font-size: 20px; padding: 12px 35px; border-radius: 12px; font-weight: bold; cursor: pointer; }
</style>
</head>
<body>
<div id="ui">
  <div>SCORE: <span id="score">0</span></div>
  <div>BEST: <span id="best">0</span></div>
</div>
<canvas id="canvas" width="320" height="400"></canvas>
<div class="controls">
  <button onclick="paddleX = Math.max(35, paddleX - 45)">◀</button>
  <button onclick="paddleX = Math.min(285, paddleX + 45)">▶</button>
</div>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let paddleX = 160, ballX = 160, ballY = 200, dx = 3, dy = 4, score = 0;
let best = localStorage.getItem('pong_high') || 0;
document.getElementById('best').innerText = best;

function update() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ballX += dx; ballY += dy;
  if(ballX < 10 || ballX > canvas.width-10) dx = -dx;
  if(ballY < 10) dy = -dy;

  if(ballY > 370 && ballX > paddleX-35 && ballX < paddleX+35) {
    dy = -dy;
    score += 10;
    document.getElementById('score').innerText = score;
    if(score > best) { best = score; localStorage.setItem('pong_high', best); document.getElementById('best').innerText = best; }
    dx *= 1.02; dy *= 1.02;
  }

  if(ballY > canvas.height) {
    alert('Game Over! Score: ' + score);
    score = 0; ballX = 160; ballY = 200; dx = 3; dy = 4;
    document.getElementById('best').innerText = best;
  }

  ctx.fillStyle = '#38BDF8';
  ctx.fillRect(paddleX - 35, 380, 70, 12);

  ctx.fillStyle = '#10B981';
  ctx.beginPath(); ctx.arc(ballX, ballY, 8, 0, Math.PI*2); ctx.fill();

  requestAnimationFrame(update);
}
update();
</script>
</body>
</html>
