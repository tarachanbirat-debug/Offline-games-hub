<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Tower Stack</title>
<style>
body { background: #0B0F19; margin: 0; overflow: hidden; font-family: sans-serif; color: #fff; text-align: center; }
#ui { display: flex; justify-content: space-around; padding: 12px; font-size: 18px; font-weight: bold; background: #1E293B; }
canvas { display: block; margin: 15px auto; background: #1E293B; box-shadow: 0 0 20px rgba(0,0,0,0.8); }
.controls { margin-top: 10px; }
button { background: #F59E0B; color: #000; border: none; font-size: 20px; padding: 14px 40px; border-radius: 12px; font-weight: bold; cursor: pointer; }
</style>
</head>
<body>
<div id="ui">
  <div>SCORE: <span id="score">0</span></div>
  <div>BEST: <span id="best">0</span></div>
</div>
<canvas id="canvas" width="320" height="380"></canvas>
<div class="controls">
  <button onclick="stackBlock()">DROP 📦</button>
</div>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let score = 0, blockX = 100, blockWidth = 100, stackHeight = 350;
let best = localStorage.getItem('tower_high') || 0;
document.getElementById('best').innerText = best;

function stackBlock() {
  score += 10;
  stackHeight -= 25;
  document.getElementById('score').innerText = score;
  if(score > best) { best = score; localStorage.setItem('tower_high', best); document.getElementById('best').innerText = best; }
}

function update() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = '#F59E0B';
  ctx.fillRect(blockX, stackHeight, blockWidth, 20);
  requestAnimationFrame(update);
}
update();
</script>
</body>
</html>
