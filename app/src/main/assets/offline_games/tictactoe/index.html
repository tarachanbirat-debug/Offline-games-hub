<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Tic-Tac-Toe AI</title>
<style>
body { background: #0B0F19; margin: 0; overflow: hidden; font-family: sans-serif; color: #fff; text-align: center; }
#ui { padding: 15px; font-size: 20px; font-weight: bold; background: #1E293B; }
#grid { display: grid; grid-template-columns: repeat(3, 90px); gap: 10px; justify-content: center; margin: 40px auto; background: #1E293B; padding: 12px; border-radius: 16px; }
.cell { width: 90px; height: 90px; background: #334155; display: flex; align-items: center; justify-content: center; font-size: 38px; font-weight: bold; border-radius: 10px; cursor: pointer; color: #FFF; }
.x { color: #EC4899; }
.o { color: #38BDF8; }
button { background: #EC4899; color: #fff; border: none; font-size: 16px; padding: 12px 30px; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 10px; }
</style>
</head>
<body>
<div id="ui">TURN: <span id="turn">X</span></div>
<div id="grid"></div>
<button onclick="reset()">RESET GAME</button>
<script>
let board = ['', '', '', '', '', '', '', '', ''];
let turn = 'X';
let active = true;

function checkWin() {
  const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  for(let w of wins) {
    if(board[w[0]] && board[w[0]] === board[w[1]] && board[w[0]] === board[w[2]]) return board[w[0]];
  }
  if(!board.includes('')) return 'TIE';
  return null;
}

function render() {
  let gridEl = document.getElementById('grid');
  gridEl.innerHTML = '';
  board.forEach((val, i) => {
    let div = document.createElement('div');
    div.className = 'cell ' + (val === 'X' ? 'x' : 'o');
    div.innerText = val;
    div.onclick = () => {
      if(!val && active) {
        board[i] = turn;
        let winner = checkWin();
        if(winner) {
          alert(winner === 'TIE' ? 'It is a Tie!' : winner + ' Wins!');
          active = false;
        } else {
          turn = turn === 'X' ? 'O' : 'X';
          document.getElementById('turn').innerText = turn;
          if(turn === 'O') aiMove();
        }
        render();
      }
    };
    gridEl.appendChild(div);
  });
}

function aiMove() {
  let empty = board.map((v, i) => v === '' ? i : null).filter(v => v !== null);
  if(empty.length > 0 && active) {
    let move = empty[Math.floor(Math.random()*empty.length)];
    board[move] = 'O';
    let winner = checkWin();
    if(winner) {
      alert(winner === 'TIE' ? 'It is a Tie!' : winner + ' Wins!');
      active = false;
    } else {
      turn = 'X';
      document.getElementById('turn').innerText = turn;
    }
  }
}

function reset() {
  board = ['', '', '', '', '', '', '', '', ''];
  turn = 'X';
  active = true;
  document.getElementById('turn').innerText = turn;
  render();
}

render();
</script>
</body>
</html>
