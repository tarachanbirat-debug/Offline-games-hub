<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Block Puzzle Blast</title>
<style>
body { background: #0B0F19; margin: 0; overflow: hidden; font-family: sans-serif; color: #fff; text-align: center; }
canvas { display: block; margin: 30px auto; background: #1E293B; border-radius: 12px; box-shadow: 0 0 20px rgba(0,0,0,0.8); }
#ui { position: absolute; top: 15px; width: 100%; font-size: 22px; font-weight: bold; }
</style>
</head>
<body>
<div id="ui">SCORE: <span id="score">0</span></div>
<canvas id="canvas" width="300" height="400"></canvas>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let score = 0;
let grid = Array(10).fill().map(() => Array(8).fill(0));

const colors = ['#0B0F19', '#FF6B6B', '#10B981', '#38BDF8', '#F59E0B', '#A66CFF'];

function draw() {
  ctx.clearRect(0,0,canvas.width, canvas.height);
  let w = canvas.width / 8;
  let h = canvas.height / 10;
  for(let r=0; r<10; r++) {
    for(let c=0; c<8; c++) {
      ctx.fillStyle = colors[grid[r][c]];
      ctx.fillRect(c*w + 1, r*h + 1, w - 2, h - 2);
    }
  }
}

setInterval(() => {
  let r = Math.floor(Math.random() * 10);
  let c = Math.floor(Math.random() * 8);
  grid[r][c] = Math.floor(Math.random() * 5) + 1;
  score += 10;
  document.getElementById('score').innerText = score;
  draw();
}, 800);

draw();
</script>
</body>
</html>
