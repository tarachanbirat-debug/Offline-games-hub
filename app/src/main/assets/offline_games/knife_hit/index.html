<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Knife Hit</title>
<style>
body { background: #0B0F19; margin: 0; overflow: hidden; font-family: sans-serif; color: #fff; text-align: center; }
#ui { display: flex; justify-content: space-around; padding: 12px; font-size: 18px; font-weight: bold; background: #1E293B; }
canvas { display: block; margin: 15px auto; background: #1E293B; box-shadow: 0 0 20px rgba(0,0,0,0.8); }
.controls { margin-top: 10px; }
button { background: #EF4444; color: #fff; border: none; font-size: 20px; padding: 14px 40px; border-radius: 12px; font-weight: bold; cursor: pointer; }
</style>
</head>
<body>
<div id="ui">
  <div>SCORE: <span id="score">0</span></div>
  <div>BEST: <span id="best">0</span></div>
</div>
<canvas id="canvas" width="320" height="380"></canvas>
<div class="controls">
  <button onclick="throwKnife()">THROW 🗡️</button>
</div>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let score = 0, angle = 0;
let best = localStorage.getItem('knife_high') || 0;
document.getElementById('best').innerText = best;

function throwKnife() {
  score += 50;
  document.getElementById('score').innerText = score;
  if(score > best) { best = score; localStorage.setItem('knife_high', best); document.getElementById('best').innerText = best; }
}

function update() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  angle += 0.03;
  ctx.save();
  ctx.translate(160, 150);
  ctx.rotate(angle);
  ctx.fillStyle = '#EF4444';
  ctx.beginPath(); ctx.arc(0,0,50,0,Math.PI*2); ctx.fill();
  ctx.restore();
  requestAnimationFrame(update);
}
update();
</script>
</body>
</html>
