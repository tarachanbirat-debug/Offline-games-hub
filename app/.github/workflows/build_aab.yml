name: Build Android APK and AAB

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK & AAB (Debug & Release)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: Generate Keystore for Release
        run: |
          keytool -genkey -v -keystore my-upload-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias upload -storepass password123 -keypass password123 -dname "CN=Android, O=AIStudio, C=US" || true

      - name: Build Debug & Release APK and AAB
        run: |
          ./gradlew assembleDebug assembleRelease bundleDebug bundleRelease
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: password123
          KEY_PASSWORD: password123

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-artifacts
          path: |
            build/outputs/apk/debug/*.apk
            build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Upload AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-aab-artifacts
          path: |
            build/outputs/bundle/debug/*.aab
            build/outputs/bundle/release/*.aab
          retention-days: 14
